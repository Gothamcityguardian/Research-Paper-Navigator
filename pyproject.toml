[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-paper-navigator"
version = "1.0.0"
description = "A secure and evaluation-driven agentic RAG system for research papers"
requires-python = ">=3.11,<3.13"

[project.scripts]
paper-navigator = "research_paper_navigator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
